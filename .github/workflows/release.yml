name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/scripts/verify-release-assets.cjs"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Set app version from the pushed tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          [[ "$tag" =~ $pattern ]] || { echo "Tag $tag is not a valid vMAJOR.MINOR.PATCH tag" >&2; exit 1; }
          npm version --allow-same-version --no-git-tag-version "${tag#v}"

      - name: Build Windows assets
        if: matrix.platform == 'win'
        run: npm run dist -- --win --publish never

      - name: Build macOS universal assets
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_FOR_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          CSC_LINK: ${{ github.event_name == 'push' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ github.event_name == 'push' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ github.event_name == 'push' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name == 'push' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          signingArgs=()
          if [[ -z "${CSC_LINK:-}" ]]; then
            unset CSC_LINK
            signingArgs+=("-c.mac.identity=-" "-c.mac.notarize=false")
            echo "::warning::macOS artifacts use ad-hoc signing because MAC_CSC_LINK is not configured. Keychain access may require renewed consent after updates; configure a consistent Developer ID Application certificate to preserve the app identity."
          else
            signingArgs+=("-c.forceCodeSigning=true" "-c.mac.type=distribution")
          fi
          npm run dist -- --mac --universal --publish never "${signingArgs[@]}"

      - name: Verify macOS universal binaries
        if: matrix.platform == 'mac'
        shell: bash
        env:
          REQUIRE_DEVELOPER_ID: ${{ github.event_name == 'push' && secrets.MAC_CSC_LINK != '' }}
        run: |
          app="release/mac-universal/DefCalendar.app/Contents"
          lipo "$app/MacOS/DefCalendar" -verify_arch x86_64 arm64
          lipo "$app/Resources/app.asar.unpacked/node_modules/better-sqlite3/build/Release/better_sqlite3.node" -verify_arch x86_64 arm64
          codesign --verify --deep --strict "$app/.."
          if [[ "$REQUIRE_DEVELOPER_ID" == "true" ]]; then
            codesign --verify --strict --test-requirement '=anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] exists and certificate leaf[field.1.2.840.113635.100.6.1.13] exists' "$app/.."
          fi
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :NSUserNotificationAlertStyle' "$app/Info.plist")" == "alert" ]]

      - name: Verify and stage release assets
        run: node .github/scripts/verify-release-assets.cjs ${{ matrix.platform }}

      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/assets/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets/

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=(release-assets/*)
          if [[ "${#assets[@]}" != 8 ]]; then
            echo "Expected eight verified release assets" >&2
            exit 1
          fi

          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1); then
            if [[ "$draft" == true ]]; then
              gh release upload "$TAG" "${assets[@]}" --clobber
              gh release edit "$TAG" --draft=false
            elif [[ "$draft" == false ]]; then
              echo "Release $TAG is already public"
            else
              echo "Unable to determine the state of release $TAG" >&2
              exit 1
            fi
          elif [[ "$draft" == 'release not found' ]]; then
            previous=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // empty')
            notes=(--generate-notes)
            if [[ -n "$previous" ]]; then
              notes+=(--notes-start-tag "$previous")
            fi
            gh release create "$TAG" "${assets[@]}" --verify-tag --target "$GITHUB_SHA" "${notes[@]}"
          else
            printf '%s\n' "$draft" >&2
            exit 1
          fi

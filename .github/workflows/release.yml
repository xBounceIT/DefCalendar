name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate tag and package version
        shell: pwsh
        env:
          ACTUAL_TAG: ${{ github.ref_name }}
        run: |
          $packageJson = Get-Content package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($packageJson.version)"
          $actualTag = $env:ACTUAL_TAG
          if ($actualTag -ne $expectedTag) {
            throw "Tag $actualTag does not match package.json version $expectedTag"
          }

      - name: Create draft release with generated notes
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          $tag = $env:TAG
          $owner = $env:OWNER
          $repo = $env:REPO_NAME
          $target = $env:TARGET_SHA
          $previousTag = $null
          $resolvedPreviousTag = git describe --tags --abbrev=0 "$tag^" 2>$null
          if ($LASTEXITCODE -eq 0 -and $resolvedPreviousTag) {
            $previousTag = $resolvedPreviousTag.Trim()
          }

          $apiArgs = @(
            "repos/$owner/$repo/releases/generate-notes",
            "--method", "POST",
            "-f", "tag_name=$tag",
            "-f", "target_commitish=$target"
          )

          if ($previousTag) {
            $apiArgs += @("-f", "previous_tag_name=$previousTag")
          }

          $notes = gh api @apiArgs | ConvertFrom-Json
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $notes.body | Out-File -FilePath $notesFile -Encoding utf8

          # Pre-create the draft release so electron-builder uploads to this
          # exact release instead of racing to create one for each parallel
          # asset upload (which produced two duplicate drafts in v0.5.0).
          # Keep it as a draft until all assets are uploaded so update checks
          # (autoUpdater) never observe a public release without installers
          # or latest.yml.
          gh release create "$tag" `
            --draft `
            --title "$($notes.name)" `
            --notes-file "$notesFile" `
            --target "$target"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Build and publish Windows assets
        if: matrix.platform == 'win'
        run: npm run dist:publish -- --win

      - name: Build and publish macOS universal assets
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          signingArgs=()
          if [[ -z "${CSC_LINK:-}" ]]; then
            unset CSC_LINK
            signingArgs+=("-c.mac.identity=-" "-c.mac.notarize=false")
            echo "::warning::macOS artifacts use ad-hoc signing because MAC_CSC_LINK is not configured. Keychain access may require renewed consent after updates; configure a consistent Developer ID Application certificate to preserve the app identity."
          else
            signingArgs+=("-c.forceCodeSigning=true" "-c.mac.type=distribution")
          fi
          npm run dist:publish -- --mac --universal "${signingArgs[@]}"

      - name: Verify macOS universal binaries
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          app="release/mac-universal/DefCalendar.app/Contents"
          lipo "$app/MacOS/DefCalendar" -verify_arch x86_64 arm64
          lipo "$app/Resources/app.asar.unpacked/node_modules/better-sqlite3/build/Release/better_sqlite3.node" -verify_arch x86_64 arm64
          codesign --verify --deep --strict "$app/.."
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :NSUserNotificationAlertStyle' "$app/Info.plist")" == "alert" ]]

  publish:
    needs: build
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish release
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Flip the release to public only after all assets are uploaded.
          gh release edit "$env:TAG" --draft=false
